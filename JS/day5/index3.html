<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
        }

        html,
        body {
            height: 100%;
            width: 100%;
        }

        #main {
            padding: 40px;
            height: 20px;
            width: 20px;
            margin: 40px
        }

        input {
            display: block;
        }

        .card {
            margin: 40px;
            border-radius: 10px;
            display: inline-block;
            padding: 20px;
            border: 1px solid #555;
            /* overflow: hidden; */

        }

        .profilepic {
            /* margin-top: 40px;  */
            width: 50px;
            height: 50px;
            border-radius: 50%;
            /* background-color: brown; */
            margin-bottom: 7px;
            overflow: hidden;
        }

        .profilepic img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .card h5 {
            margin-top: 3px;
        }

        .card p {
            font-size: 12px;
            margin-top: 10px;
        }
    </style>
</head>

<body>
    <div id="main">
        <form action="">
            <input type="text" placeholder="profilepic">
            <input type="text" placeholder="name">
            <input type="text" placeholder="job">
            <input type="text" placeholder="info">
            <input type="submit">
        </form>
    </div>
